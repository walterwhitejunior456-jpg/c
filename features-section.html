<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background-color: #fff; color: #333; -webkit-text-size-adjust: 100%;
    }
    .features-section { max-width: 750px; margin: 0 auto; padding: 40px 20px; background-color: #fff; }
    .features-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .feature-card {
      background-color: #f5f5f5;
      border-radius: 12px;
      padding: 24px;
    }
    .feature-label {
      font-size: 13px;
      font-weight: 700;
      color: #4DA6E3;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .feature-title {
      font-size: 17px;
      font-weight: 700;
      color: #222;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .feature-desc {
      font-size: 14px;
      color: #555;
      line-height: 1.8;
    }
    @media (max-width: 480px) {
      .features-section { padding: 32px 16px; }
      .features-grid { grid-template-columns: 1fr; gap: 14px; }
      .feature-card { padding: 20px; }
      .feature-title { font-size: 16px; }
      .feature-desc { font-size: 13px; }
    }
  </style>
</head>
<body>
  <section class="features-section">
    <div class="features-grid">
      <div class="feature-card">
        <p class="feature-label">① 張力の分散</p>
        <h3 class="feature-title">背中全体で支える</h3>
        <p class="feature-desc">交差するバンドが張力を均等に分散。一部の筋肉だけに負荷がかからないから、長時間でも続けられる。</p>
      </div>
      <div class="feature-card">
        <p class="feature-label">② 筋肉の再教育</p>
        <h3 class="feature-title">支えるのではなく、導く</h3>
        <p class="feature-desc">コルセットとは違い、筋肉の代わりに動くのではなく、筋肉が正しく使われる位置に導く。だから使うほど体が自立する。</p>
      </div>
      <div class="feature-card">
        <p class="feature-label">③ 肩甲骨の誘導</p>
        <h3 class="feature-title">強制しない、そっと戻す</h3>
        <p class="feature-desc">肩甲骨を後ろへそっと引き寄せる。強く引っ張らないから、動いても苦しくない。</p>
      </div>
      <div class="feature-card">
        <p class="feature-label">④ 血行の改善</p>
        <h3 class="feature-title">姿勢が整うと呼吸が変わる</h3>
        <p class="feature-desc">猫背が解消されると胸郭が開き、呼吸が深くなる。夕方の疲れや集中力の低下が変わってくる。</p>
      </div>
    </div>
  </section>
</body>
</html>
