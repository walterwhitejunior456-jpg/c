<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メシトラ - 鏡を見るたびまた楽しくなる</title>
  <meta name="description" content="だらしない体型とおさらばしたい、すべての人へ。撮るだけの習慣が一番自信を持てていた頃の自分へ導く。">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; background-color: #f5f5f5; overflow-x: hidden; }
    .lp-container { max-width: 750px; margin: 0 auto; background-color: #fff; padding-bottom: 80px; }
    .lp-section { display: block; width: 100%; }
    .lp-section img { display: block; width: 100%; height: auto; }
    .lp-section a { display: block; }
    .lp-section a:active img { opacity: 0.85; }
    .sticky-cta { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.95) 25%); padding: 16px 20px 20px; text-align: center; pointer-events: none; }
    .sticky-cta a { pointer-events: auto; display: inline-block; width: 100%; max-width: 500px; padding: 18px 24px; background: linear-gradient(to bottom, #8cd460, #5cb531); color: #fff; font-size: 18px; font-weight: bold; text-decoration: none; border-radius: 50px; box-shadow: 0 4px 15px rgba(92,181,49,0.45); letter-spacing: 0.05em; }
    .sticky-cta a:active { transform: scale(0.97); }
    @media (min-width: 751px) { .sticky-cta { display: none; } .lp-container { padding-bottom: 0; } }
  </style>
</head>
<body>
  <main class="lp-container">
    <!-- Alt Hero: Women's angle -->
    <section class="lp-section">
      <img src="images/hero-women.jpg" alt="鏡を見るたびまた楽しくなる！変わってしまった体型をAIと一緒に巻き戻す。" loading="eager">
    </section>
    <section class="lp-section"><img src="images/section-04.jpg" alt="問題提起" loading="lazy"></section>
    <section class="lp-section"><img src="images/section-05.jpg" alt="使い方3ステップ" loading="lazy"></section>
    <section class="lp-section"><img src="images/section-06.jpg" alt="ユーザーの声" loading="lazy"></section>
    <section class="lp-section"><img src="images/section-07.jpg" alt="グラフで楽しく" loading="lazy"></section>
    <section class="lp-section"><img src="images/section-08.jpg" alt="AIパートナー" loading="lazy"></section>
    <section class="lp-section"><img src="images/section-09.jpg" alt="CTA" loading="lazy"></section>
    <section class="lp-section" id="download">
      <a href="#"><img src="images/cta-tiger.jpg" alt="今すぐダウンロード" loading="lazy"></a>
    </section>
  </main>
  <div class="sticky-cta"><a href="#">30秒で登録完了！今すぐダウンロード</a></div>
</body>
</html>
